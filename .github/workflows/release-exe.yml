name: Windows-EXE

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'server/**'
      - 'web/**'
      - 'packages/**'
      - 'scripts/build-exe.mjs'
      - '.github/workflows/release-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:exe

      - name: Smoke-Test (EXE starten, Web-App und API prüfen)
        shell: pwsh
        run: |
          $env:PORT = '8799'
          $env:UELIGHTS_NO_BROWSER = '1'
          $p = Start-Process -FilePath release\ueLights.exe -PassThru -RedirectStandardOutput out.log -RedirectStandardError err.log
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            try { $r = Invoke-WebRequest -UseBasicParsing http://localhost:8799/api/health -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep -Milliseconds 500 }
          }
          Get-Content out.log, err.log -ErrorAction SilentlyContinue
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw 'EXE antwortet nicht' }
          $html = (Invoke-WebRequest -UseBasicParsing http://localhost:8799/).Content
          if ($html -notmatch '<title>ueLights</title>') { Stop-Process -Id $p.Id -Force; throw 'Web-App fehlt' }
          Stop-Process -Id $p.Id -Force
          Write-Host 'EXE läuft ✔'

      - uses: actions/upload-artifact@v4
        with:
          name: ueLights-windows
          path: release/ueLights.exe

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/ueLights.exe
          generate_release_notes: true
          body: |
            **ueLights.exe herunterladen, doppelklicken, fertig.** Keine Installation, Node.js ist eingebaut.

            - Öffnet den Browser auf http://localhost:8787
            - Daten liegen in `%LOCALAPPDATA%\ueLights`
            - Windows SmartScreen: „Weitere Informationen“ → „Trotzdem ausführen“ (die Datei ist nicht signiert)
            - Beim ersten Start die Firewall-Frage für private Netzwerke erlauben (Zugriff vom Handy, Govee)
